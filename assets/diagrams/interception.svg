<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="title desc"><title id="title">Slowing runoff is different from intercepting it</title><desc id="desc">The first basin section has a low-level outlet that lets everyday runoff leave. The second shows a below-outlet zone whose actual retention, infiltration and feature conditions must be demonstrated.</desc><rect width="840" height="310" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#2a4365"><text x="24" y="31" font-weight="700">Runoff passes through</text><text x="446" y="31" font-weight="700">Check the below-outlet zone</text><path d="M24 93H74L135 201H286L346 93H389M446 93H484L545 201H696L756 93H811" fill="#edf2f7" stroke="#2a4365" stroke-width="2"/><path d="M100 156H321" stroke="#1e568b" stroke-width="2" stroke-dasharray="5 3"/><text x="122" y="139" font-size="15">Attenuation storage</text><path d="M158 188H350" stroke="#1e568b" stroke-width="5"/><text x="202" y="232" font-size="15">Low outlet</text><path d="M510 145H812" stroke="#1e568b" stroke-width="3"/><text x="695" y="129" font-size="15">Outlet level</text><path d="M546 184H696" stroke="#1e568b" stroke-width="4"/><text x="545" y="174" font-size="15">Effective zone</text><path d="M580 210V232M622 210V232M662 210V232" stroke="#1e568b" stroke-width="2"/><text x="466" y="254" font-size="15">Check lining, infiltration and low-flow routing</text><text x="24" y="286" font-size="16">Storage alone does not prove interception.</text><text x="446" y="286" font-size="16">All applicable feature conditions must be satisfied.</text></g></svg>
