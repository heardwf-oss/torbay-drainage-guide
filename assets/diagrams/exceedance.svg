<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="title desc"><title id="title">Exceedance routes need levels and a safe destination</title><desc id="desc">The left plan shows a flow arrow pointing into a building entrance. The right plan follows a levelled route past the building to a destination that still needs its boundary effects checked.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#1e568b" stroke-width="1.5"/></marker></defs><rect width="840" height="310" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#2a4365"><text x="24" y="31" font-weight="700">Question the route</text><text x="446" y="31" font-weight="700">Trace the levels and consequences</text><rect x="24" y="54" width="365" height="192" fill="#edf2f7" stroke="#8295ad" stroke-dasharray="5 4"/><rect x="446" y="54" width="365" height="192" fill="#edf2f7" stroke="#8295ad" stroke-dasharray="5 4"/><rect x="178" y="98" width="156" height="109" fill="#fff" stroke="#2a4365" stroke-width="2"/><rect x="554" y="98" width="156" height="109" fill="#fff" stroke="#2a4365" stroke-width="2"/><text x="196" y="135">Building</text><text x="573" y="135">Building</text><text x="194" y="164" font-size="15">Entrance</text><path d="M66 192L178 162" stroke="#1e568b" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M488 87L488 222L772 222" stroke="#1e568b" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="56" y="91" font-size="15">No supporting levels</text><text x="554" y="85" font-size="15">Check thresholds</text><text x="710" y="158" font-size="15">Check</text><text x="710" y="179" font-size="15">destination</text><text x="24" y="277" font-size="16">Arrows alone do not demonstrate performance.</text><text x="446" y="277" font-size="16">Check incoming flows and neighbouring land.</text></g></svg>
