<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="title desc"><title id="title">Check whether maintenance access is practical</title><desc id="desc">The left plan has a route interrupted by an obstruction before a buried asset. The right plan shows a continuous route, while its suitability for the actual equipment and legal access rights still needs checking.</desc><rect width="840" height="310" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#2a4365"><text x="24" y="31" font-weight="700">A route marked “access”</text><text x="446" y="31" font-weight="700">Check the actual maintenance task</text><rect x="24" y="60" width="365" height="187" fill="#edf2f7" stroke="#8295ad"/><rect x="446" y="60" width="365" height="187" fill="#edf2f7" stroke="#8295ad"/><rect x="255" y="105" width="105" height="89" fill="#fff" stroke="#2a4365" stroke-width="2"/><rect x="677" y="105" width="105" height="89" fill="#fff" stroke="#2a4365" stroke-width="2"/><text x="270" y="142" font-size="15">Buried</text><text x="270" y="163" font-size="15">asset</text><text x="692" y="142" font-size="15">Buried</text><text x="692" y="163" font-size="15">asset</text><path d="M51 151H255M473 151H677" stroke="#1e568b" stroke-width="5"/><rect x="159" y="103" width="54" height="103" fill="#fcf3ce" stroke="#8c7218" stroke-width="2"/><text x="61" y="88" font-size="15">Obstructed route</text><text x="467" y="88" font-size="15">Continuous route</text><text x="461" y="220" font-size="15">Verify equipment, replacement and rights</text><text x="24" y="281" font-size="16">Show the obstruction and how it will be resolved.</text><text x="446" y="281" font-size="16">Match access to inspection, cleaning and replacement.</text></g></svg>
