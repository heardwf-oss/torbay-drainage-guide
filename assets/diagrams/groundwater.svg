<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="title desc"><title id="title">Relate groundwater to the feature base</title><desc id="desc">Two sections compare an unreferenced groundwater depth with evidence placing the proposed base and maximum likely groundwater on one datum and showing their separation.</desc><rect width="840" height="310" fill="#fff"/><g font-family="Arial,sans-serif" font-size="17" fill="#2a4365"><text x="24" y="31" font-weight="700">A depth without a datum</text><text x="446" y="31" font-weight="700">Levels that can be compared</text><path d="M24 82H389M446 82H811" stroke="#2a4365" stroke-width="2"/><text x="26" y="70" font-size="15">Ground</text><text x="448" y="70" font-size="15">Ground</text><path d="M99 82V141H285V82M513 82V141H679V82" fill="#edf2f7" stroke="#2a4365" stroke-width="2"/><text x="113" y="120" font-size="15">Proposed feature</text><text x="524" y="120" font-size="15">Proposed feature</text><path d="M24 202H389" stroke="#1e568b" stroke-width="3" stroke-dasharray="6 4"/><text x="28" y="224" font-size="15">Groundwater: reported depth only</text><text x="137" y="174" font-size="23">?</text><path d="M446 220H811" stroke="#1e568b" stroke-width="3" stroke-dasharray="6 4"/><path d="M704 141V220M696 141H712M696 220H712" stroke="#2a4365" stroke-width="2"/><text x="719" y="178" font-size="15">Check</text><text x="719" y="198" font-size="15">separation</text><text x="451" y="244" font-size="15">Maximum likely groundwater</text><text x="24" y="282" font-size="16">A dry-season level may not be the maximum.</text><text x="446" y="282" font-size="16">Read the 1 m criterion and conditions in IG-03.</text></g></svg>
